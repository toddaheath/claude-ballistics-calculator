name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (commit SHA or "latest")'
        required: true
        default: 'latest'

jobs:
  deploy-api:
    name: Deploy API to prod AKS
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy API with Helm
        run: |
          helm upgrade --install ballistics-calc-api \
            deploy/helm/ballistics-calculator/ \
            -f deploy/helm/ballistics-calculator/values-prod.yaml \
            --set api.image.repository=${{ vars.ACR_LOGIN_SERVER }}/ballistics-calculator-api \
            --set api.image.tag=${{ inputs.tag }} \
            --set api.jwtSecret=${{ secrets.JWT_SECRET }} \
            --set fullnameOverride=ballistics-calc \
            --namespace ballistics-calc-api-prod \
            --create-namespace \
            --wait \
            --timeout 12m \
            --cleanup-on-fail
