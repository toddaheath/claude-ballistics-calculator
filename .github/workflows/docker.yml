name: Build & Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  build-push:
    name: Build & Push Images to ACR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/ballistics-calculator-api:${{ github.event.workflow_run.head_sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/ballistics-calculator-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy API to dev AKS
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Clear stuck terminating pods
        run: |
          kubectl get pods -n ballistics-calc-api-dev \
            -o json 2>/dev/null \
            | jq -r '.items[] | select(.metadata.deletionTimestamp != null) | .metadata.name' \
            | xargs -r -I{} kubectl delete pod {} \
                --force --grace-period=0 \
                -n ballistics-calc-api-dev \
            || true

      - name: Reset stuck Helm release
        run: |
          STATUS=$(helm status ballistics-calc-api \
            -n ballistics-calc-api-dev \
            -o json 2>/dev/null | jq -r '.info.status' 2>/dev/null || echo "not-found")
          case "$STATUS" in
            failed|pending-install|pending-upgrade|pending-rollback)
              echo "Release in '$STATUS' state — uninstalling to reset"
              helm uninstall ballistics-calc-api -n ballistics-calc-api-dev --wait || true
              kubectl delete pvc -l app.kubernetes.io/instance=ballistics-calc-api \
                -n ballistics-calc-api-dev --wait=false || true
              ;;
          esac

      - name: Deploy API with Helm
        run: |
          helm upgrade --install ballistics-calc-api \
            deploy/helm/ballistics-calculator/ \
            -f deploy/helm/ballistics-calculator/values-dev.yaml \
            --set api.image.repository=${{ vars.ACR_LOGIN_SERVER }}/ballistics-calculator-api \
            --set api.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set api.jwtSecret=${{ secrets.JWT_SECRET }} \
            --set fullnameOverride=ballistics-calc \
            --namespace ballistics-calc-api-dev \
            --create-namespace \
            --wait \
            --timeout 12m \
            --cleanup-on-fail
