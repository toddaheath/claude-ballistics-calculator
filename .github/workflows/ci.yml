name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore BallisticsCalculator.sln

      - name: Build
        run: dotnet build BallisticsCalculator.sln --no-restore

      - name: Test with coverage
        run: dotnet test BallisticsCalculator.sln --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Check for vulnerable NuGet packages
        run: dotnet list BallisticsCalculator.sln package --vulnerable 2>&1 | tee /tmp/vuln.txt && ! grep -q 'has the following vulnerable packages' /tmp/vuln.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'
          retention-days: 30

  client:
    name: Client Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/BallisticsCalculator.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/BallisticsCalculator.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: TypeScript strict check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint with default values
        run: helm lint deploy/helm/ballistics-calculator

      - name: Lint with dev values
        run: helm lint deploy/helm/ballistics-calculator -f deploy/helm/ballistics-calculator/values-dev.yaml

      - name: Lint with prod values
        run: helm lint deploy/helm/ballistics-calculator -f deploy/helm/ballistics-calculator/values-prod.yaml
