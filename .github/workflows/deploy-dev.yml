name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (commit SHA or "latest")'
        required: true
        default: 'latest'
      deploy_spa:
        description: 'Also deploy SPA to dev Azure Storage'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-api-dev
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Deploy API to dev AKS
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Clear stuck terminating pods
        run: |
          kubectl get pods -n ballistics-calc-api-dev \
            -o json 2>/dev/null \
            | jq -r '.items[] | select(.metadata.deletionTimestamp != null) | .metadata.name' \
            | xargs -r -I{} kubectl delete pod {} \
                --force --grace-period=0 \
                -n ballistics-calc-api-dev \
            || true

      - name: Reset stuck Helm release
        run: |
          STATUS=$(helm status ballistics-calc-api \
            -n ballistics-calc-api-dev \
            -o json 2>/dev/null | jq -r '.info.status' 2>/dev/null || echo "not-found")
          case "$STATUS" in
            failed|pending-install|pending-upgrade|pending-rollback)
              echo "Release in '$STATUS' state — uninstalling to reset"
              helm uninstall ballistics-calc-api -n ballistics-calc-api-dev --wait || true
              kubectl delete pvc -l app.kubernetes.io/instance=ballistics-calc-api \
                -n ballistics-calc-api-dev --wait=false || true
              ;;
          esac

      - name: Deploy API with Helm
        run: |
          helm upgrade --install ballistics-calc-api \
            deploy/helm/ballistics-calculator/ \
            -f deploy/helm/ballistics-calculator/values-dev.yaml \
            --set api.image.repository=${{ vars.ACR_LOGIN_SERVER }}/ballistics-calculator-api \
            --set api.image.tag=${{ inputs.tag }} \
            --set api.jwtSecret=${{ secrets.JWT_SECRET }} \
            --set fullnameOverride=ballistics-calc \
            --namespace ballistics-calc-api-dev \
            --create-namespace \
            --wait \
            --timeout 12m \
            --cleanup-on-fail

  deploy-spa:
    name: Deploy SPA to dev Storage
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_spa == true }}
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/BallisticsCalculator.Client/package-lock.json

      - name: Install dependencies
        working-directory: src/BallisticsCalculator.Client
        run: npm ci

      - name: Build SPA
        working-directory: src/BallisticsCalculator.Client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload SPA to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name stballisticscalcspadev \
            --source src/BallisticsCalculator.Client/dist \
            --destination '$web' \
            --overwrite \
            --auth-mode login
