name: Build & Deploy SPA

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy-dev:
    name: Deploy SPA to dev Storage
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/BallisticsCalculator.Client/package-lock.json

      - name: Install dependencies
        working-directory: src/BallisticsCalculator.Client
        run: npm ci

      - name: Build SPA
        working-directory: src/BallisticsCalculator.Client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload SPA to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name stballisticscalcspadev \
            --source src/BallisticsCalculator.Client/dist \
            --destination '$web' \
            --overwrite \
            --auth-mode login

  deploy-prod:
    name: Deploy SPA to prod Storage
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/BallisticsCalculator.Client/package-lock.json

      - name: Install dependencies
        working-directory: src/BallisticsCalculator.Client
        run: npm ci

      - name: Build SPA
        working-directory: src/BallisticsCalculator.Client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload SPA to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name stballisticscalcspaprod \
            --source src/BallisticsCalculator.Client/dist \
            --destination '$web' \
            --overwrite \
            --auth-mode login
