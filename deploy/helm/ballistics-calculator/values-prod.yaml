api:
  replicaCount: 2
  image:
    repository: ghcr.io/toddaheath/ballistics-calculator-api
    tag: latest
    pullPolicy: Always
  corsAllowedOrigins: "https://ballistics-calc.heathrobotics.io"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

postgresql:
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    database: ballistics
    existingSecret: ballistics-db-credentials
  storage:
    size: 5Gi
  service:
    port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: ballistics-calc-api.heathrobotics.io
  certSecret: ballistics-calc-api-prod-tls
  corsAllowOrigin: "https://ballistics-calc.heathrobotics.io"
