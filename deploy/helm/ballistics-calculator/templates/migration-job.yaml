apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ballistics-calculator.fullname" . }}-migration
  labels:
    {{- include "ballistics-calculator.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "ballistics-calculator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["dotnet", "BallisticsCalculator.Api.dll", "--migrate-only"]
          envFrom:
            - configMapRef:
                name: {{ include "ballistics-calculator.fullname" . }}-config
            - secretRef:
                name: {{ include "ballistics-calculator.fullname" . }}-secret
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
