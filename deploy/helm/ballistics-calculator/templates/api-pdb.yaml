{{- if gt (int .Values.api.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ballistics-calculator.fullname" . }}-api
  labels:
    {{- include "ballistics-calculator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "ballistics-calculator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
