apiVersion: v1
kind: Service
metadata:
  name: {{ include "ballistics-calculator.fullname" . }}-api
  labels:
    {{- include "ballistics-calculator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "ballistics-calculator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
