apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ballistics-calculator.fullname" . }}-api
  labels:
    {{- include "ballistics-calculator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: {{ .Values.api.deploymentStrategy | default "RollingUpdate" }}
  selector:
    matchLabels:
      {{- include "ballistics-calculator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "ballistics-calculator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "ballistics-calculator.fullname" . }}-postgresql -p 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3
              done
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["dotnet", "BallisticsCalculator.Api.dll", "--migrate-only"]
          envFrom:
            - configMapRef:
                name: {{ include "ballistics-calculator.fullname" . }}-config
            - secretRef:
                name: {{ include "ballistics-calculator.fullname" . }}-secret
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ballistics-calculator.fullname" . }}-config
            - secretRef:
                name: {{ include "ballistics-calculator.fullname" . }}-secret
            {{- if .Values.postgresql.auth.existingSecret }}
            - secretRef:
                name: {{ .Values.postgresql.auth.existingSecret }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.service.targetPort }}
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.service.targetPort }}
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.api.service.targetPort }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
