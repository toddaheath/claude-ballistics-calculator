api:
  replicaCount: 1
  jwtSecret: ""      # required — supply via --set api.jwtSecret=... or CI secret
  jwtIssuer: "ballistics-api"
  jwtAudience: "ballistics-client"
  image:
    repository: ballistics-calculator-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    database: ballistics
    username: postgres
    password: postgres
  storage:
    size: 1Gi
  service:
    port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: ballistics.local
