api:
  replicaCount: 1
  deploymentStrategy: Recreate
  terminationGracePeriodSeconds: 15
  image:
    repository: ballistics-calculator-api  # overridden by --set at deploy time
    tag: latest
    pullPolicy: Always
  corsAllowedOrigins: "https://ballistics-calc.dev.heathrobotics.io,http://localhost:5173"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    database: ballistics
    username: postgres
    password: postgres
  storage:
    size: 1Gi
  service:
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: ballistics-calc-api.dev.heathrobotics.io
  certSecret: ballistics-calc-api-dev-tls
